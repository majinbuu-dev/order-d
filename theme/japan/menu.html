<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>桜亭 — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .btn-scale:active { transform: scale(0.95); transition: transform 0.1s; }

    .cat-tab { transition: all 0.2s; }
    .cat-tab.active { color: #1a237e; border-bottom: 2px solid #1a237e; }

    .menu-item { animation: fadeUp 0.5s ease-out both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .cart-drawer { transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .cart-drawer.open { transform: translateX(0); }
    .cart-overlay { opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .cart-overlay.open { opacity: 1; visibility: visible; }

    @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .badge-pop { animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    #main-header { transition: transform 0.3s ease; }
    #main-header.hide { transform: translateY(-100%); }
    #search-bar { transition: top 0.3s ease; }
    #category-nav-bar { transition: top 0.3s ease; }
  </style>
</head>
<body class="bg-[#faf8f5] text-[#1a1a2e] font-body antialiased">

  <!-- HEADER -->
  <header id="main-header" class="sticky top-0 z-50 bg-[#1a237e] shadow-lg">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <a href="store.html" class="p-2 -ml-2 btn-scale flex-shrink-0">
          <svg class="w-5 h-5 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        </a>
        <h1 class="font-display text-lg font-bold text-white tracking-wide leading-tight store-name">桜亭</h1>
      </div>
      <button id="cart-btn" class="relative p-2 -mr-2 btn-scale flex-shrink-0" onclick="toggleCart()">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cart-badge" class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden badge-pop">0</span>
      </button>
    </div>
  </header>

  <!-- SEARCH -->
  <div id="search-bar" class="sticky top-14 z-40 bg-white border-b border-stone-200 px-4 h-12 flex items-center">
    <div class="max-w-lg mx-auto relative w-full">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="search-input" type="search" placeholder="Tìm món..."
        class="w-full pl-9 pr-4 py-2 bg-stone-50 border border-stone-200 rounded-full text-sm placeholder-stone-400 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-100" />
    </div>
  </div>

  <!-- CATEGORY TABS -->
  <nav id="category-nav-bar" class="sticky top-[104px] z-30 bg-white border-b border-stone-200">
    <div class="max-w-lg mx-auto px-4">
      <div id="category-tabs" class="flex overflow-x-auto scrollbar-hide gap-1">
        <!-- filled by JS -->
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="max-w-lg mx-auto px-4 pt-4 pb-10">
    <p id="result-count" class="text-xs text-stone-400 mb-3"></p>
    <div id="menu-list" class="space-y-4"></div>
  </main>

  <!-- BOTTOM CART BAR -->
  <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 z-30 bg-[#1a237e] shadow-2xl px-4 py-3 hidden">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3" onclick="toggleCart()">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <div>
          <p class="text-white text-sm font-semibold" id="bottom-count">0 món</p>
          <p class="text-indigo-300 text-xs" id="bottom-total">0đ</p>
        </div>
      </div>
      <button onclick="goToCheckout()" class="px-5 py-2 bg-white text-indigo-900 text-sm font-semibold rounded-full btn-scale">Thanh toán</button>
    </div>
  </div>

  <!-- CART OVERLAY -->
  <div id="cart-overlay" class="cart-overlay fixed inset-0 bg-black/40 z-40" onclick="closeCart()"></div>

  <!-- CART DRAWER -->
  <div id="cart-drawer" class="cart-drawer fixed right-0 top-0 h-full w-full sm:w-[400px] z-50 flex flex-col bg-white shadow-2xl">
    <div class="flex items-center justify-between px-5 h-14 border-b border-stone-100 flex-shrink-0 bg-indigo-50">
      <div class="flex items-center gap-2">
        <span class="text-lg">🍣</span>
        <h2 class="font-display text-lg font-semibold text-indigo-900">Đơn hàng</h2>
      </div>
      <button onclick="closeCart()" class="p-2 -mr-2 btn-scale text-indigo-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>

    <div id="cart-footer" class="border-t border-stone-100 px-5 py-4 space-y-3 flex-shrink-0 hidden">
      <div class="flex justify-between text-sm text-stone-500"><span>Tạm tính</span><span id="subtotal">0đ</span></div>
      <div class="flex justify-between text-sm text-stone-500"><span>VAT (10%)</span><span id="vat-amount">0đ</span></div>
      <div class="flex justify-between text-base font-semibold pt-2 border-t border-stone-100">
        <span>Tổng cộng</span><span id="total" class="text-lg text-indigo-700">0đ</span>
      </div>
      <button onclick="goToCheckout()" class="w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white font-semibold rounded-xl btn-scale">Đặt hàng — <span id="drawer-total">0đ</span></button>
    </div>
  </div>

  <script src="../../data/store.js"></script>
  <script src="../../data/menu.js"></script>
  <script>ORDERD.featuredTag = 'featured';</script>
  <script>
    const categories = Object.keys(ORDERD.catLabels);
    let activeCat = 'all';
    let cart = [];

    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }

    const searchInput = document.getElementById('search-input');
    let searchQuery = '', searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { searchQuery = searchInput.value.trim().toLowerCase(); activeCat = 'all'; renderTabs(); render(); }, 200);
    });

    function renderTabs() {
      const el = document.getElementById('category-tabs');
      el.innerHTML = [
        `<button class="cat-tab flex-shrink-0 px-4 py-3 text-sm font-medium whitespace-nowrap ${activeCat==='all'?'active text-indigo-900':'text-stone-400'}" data-cat="all">Tất Cả</button>`,
        ...categories.map(c => `<button class="cat-tab flex-shrink-0 px-4 py-3 text-sm font-medium whitespace-nowrap ${activeCat===c?'active text-indigo-900':'text-stone-400'}" data-cat="${c}">${ORDERD.catLabels[c]}</button>`)
      ].join('');
      el.querySelectorAll('.cat-tab').forEach(btn => btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat; searchInput.value = ''; searchQuery = ''; renderTabs(); render();
      }));
    }

    function render() {
      let items = ORDERD.items;
      if (searchQuery) items = items.filter(m => m.name.toLowerCase().includes(searchQuery) || m.tags.some(t => t.toLowerCase().includes(searchQuery)));
      if (activeCat !== 'all') items = items.filter(m => m.cat === activeCat);
      document.getElementById('result-count').textContent = items.length + ' món';

      const list = document.getElementById('menu-list');
      if (items.length === 0) {
        list.innerHTML = '<div class="py-16 text-center text-stone-400"><p class="text-lg mb-1">Không tìm thấy món nào</p><p class="text-sm">Thử tìm kiếm khác nhé</p></div>';
      } else {
        list.innerHTML = items.map((m, i) => `
          <div class="menu-item flex items-center gap-3 px-1" style="animation-delay:${i*60}ms">
            <img src="${m.img}" alt="${m.name}" loading="lazy" class="w-14 h-14 rounded-xl object-cover flex-shrink-0 bg-stone-100" />
            <div class="flex-1 min-w-0 py-2 border-b border-stone-100">
              <h3 class="font-semibold text-sm leading-snug line-clamp-2">
                ${m.name}
                ${m.tags.includes(ORDERD.featuredTag) ? '<span class="text-[10px] text-indigo-500 font-medium ml-1 align-middle">推</span>' : ''}
              </h3>
              <div class="flex items-center justify-between gap-2 mt-1">
                <span class="font-semibold text-sm text-indigo-900">${formatVND(m.price)}</span>
                <p class="text-stone-400 text-xs leading-relaxed line-clamp-1">${m.desc}</p>
              </div>
            </div>
            <button onclick="event.stopPropagation();update('${m.id}',1)" class="w-7 h-7 flex items-center justify-center bg-indigo-700 text-white rounded-full btn-scale hover:bg-indigo-800 flex-shrink-0">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            </button>
          </div>
        `).join('');
      }
      updateCartUI();
    }

    function update(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx >= 0) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); }
      else if (delta > 0) cart.push({ id, qty: delta });
      saveCartLS(); updateCartUI();
    }
    function removeFromCart(id) { cart = cart.filter(c => c.id !== id); saveCartLS(); updateCartUI(); }

    function updateCartUI() {
      const count = cart.reduce((s,c) => s + c.qty, 0);
      const total = cart.reduce((s, c) => { const m = ORDERD.items.find(x => x.id === c.id); return s + (m ? m.price * c.qty : 0); }, 0);

      const badge = document.getElementById('cart-badge');
      if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');

      const bar = document.getElementById('bottom-bar');
      if (count > 0) { bar.classList.remove('hidden'); document.getElementById('bottom-count').textContent = count + ' món'; document.getElementById('bottom-total').textContent = formatVND(total); }
      else bar.classList.add('hidden');

      const itemsEl = document.getElementById('cart-items'), footerEl = document.getElementById('cart-footer');
      if (cart.length === 0) { itemsEl.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-stone-300 gap-3"><svg class="w-14 h-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><p class="text-sm">Chưa có món nào</p></div>'; footerEl.classList.add('hidden'); return; }

      itemsEl.innerHTML = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); if (!m) return ''; return `
        <div class="flex gap-3 items-center"><img src="${m.img}" class="w-12 h-12 rounded-xl object-cover" /><div class="flex-1 min-w-0"><h4 class="font-medium text-sm truncate">${m.name}</h4><p class="text-indigo-500 text-xs">${formatVND(m.price)}</p></div><div class="flex items-center gap-1 bg-indigo-50 rounded-full p-0.5"><button onclick="update('${m.id}',-1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-indigo-600 btn-scale text-xs font-bold">−</button><span class="w-6 text-center text-sm font-semibold">${c.qty}</span><button onclick="update('${m.id}',1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-indigo-700 text-white btn-scale text-xs font-bold">+</button></div><button onclick="removeFromCart('${m.id}')" class="p-1 text-stone-300 hover:text-red-400 btn-scale"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div>` }).join('');

      const sub = cart.reduce((s,c)=>{const m=ORDERD.items.find(x=>x.id===c.id);return s+(m?m.price*c.qty:0)},0);
      const tax = Math.round(sub*0.10*100)/100;
      const totalAll = Math.round((sub+tax)*100)/100;
      document.getElementById('subtotal').textContent = formatVND(sub);
      document.getElementById('vat-amount').textContent = formatVND(tax);
      document.getElementById('total').textContent = formatVND(totalAll);
      document.getElementById('drawer-total').textContent = formatVND(totalAll);
      footerEl.classList.remove('hidden');
    }

    function goToCheckout() {
      const data = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); return { ...c, name: m.name, price: m.price, img: m.img }; });
      localStorage.setItem('orderd_cart', JSON.stringify(data));
      window.location.href = 'checkout.html';
    }
    function toggleCart() { document.getElementById('cart-drawer').classList.toggle('open'); document.getElementById('cart-overlay').classList.toggle('open'); document.body.style.overflow = document.getElementById('cart-drawer').classList.contains('open') ? 'hidden' : ''; }
    function closeCart() { document.getElementById('cart-drawer').classList.remove('open'); document.getElementById('cart-overlay').classList.remove('open'); document.body.style.overflow = ''; }
    function saveCartLS() { const d = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); return { ...c, name: m?.name, price: m?.price, img: m?.img }; }); localStorage.setItem('orderd_cart', JSON.stringify(d)); }
    function loadCartLS() { try { cart = JSON.parse(localStorage.getItem('orderd_cart') || '[]').map(c => ({ id: c.id, qty: c.qty })); } catch(e) { cart = []; } }

    loadCartLS();
    document.querySelectorAll('.store-name').forEach(el => el.textContent = ORDERD.store.name);
    renderTabs(); render();

    let lastScroll = 0;
    const mainHeader = document.getElementById('main-header');
    const searchBar = document.getElementById('search-bar');
    const navBar = document.getElementById('category-nav-bar');
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      if (y > lastScroll && y > 60) {
        mainHeader.classList.add('hide');
        searchBar.style.top = '0px';
        navBar.style.top = '48px';
      } else if (y < lastScroll) {
        mainHeader.classList.remove('hide');
        searchBar.style.top = '56px';
        navBar.style.top = '104px';
      }
      lastScroll = y;
    }, { passive: true });
  </script>
</body>
</html>
