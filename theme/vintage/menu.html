<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Le Petit — Thực Đơn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'], serif: ['"Cormorant Garamond"', 'Georgia', 'serif'] } } } }</script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .btn-scale:active { transform: scale(0.95); transition: transform 0.1s; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .cat-link { position: relative; transition: all 0.2s; }
    .cat-link.active { color: #5d4037; font-weight: 600; }
    .cat-link.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 2px; background: #5d4037; border-radius: 1px; }

    .menu-item { animation: fadeUp 0.5s ease-out both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .cart-drawer { transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .cart-drawer.open { transform: translateX(0); }
    .cart-overlay { opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .cart-overlay.open { opacity: 1; visibility: visible; }

    @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .badge-pop { animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  </style>
</head>
<body class="bg-[#f5f0e8] text-[#4e342e] font-body antialiased">

  <!-- HEADER -->
  <header class="bg-[#5d4037] px-4 py-3">
    <div class="max-w-lg mx-auto flex items-center gap-3">
      <a href="store.html" class="w-12 h-12 rounded-xl overflow-hidden flex-shrink-0 border border-[#8d6e63]">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=200&q=80" class="w-full h-full object-cover" />
      </a>
      <a href="store.html" class="flex-1 min-w-0">
        <h1 class="font-display text-xl text-white tracking-wide store-name">Le Petit</h1>
        <p class="text-[#c8a165] font-serif italic text-[10px] store-tagline">Bistro & Café</p>
      </a>
      <button onclick="toggleCart()" class="relative p-2 btn-scale flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="top-badge" class="absolute top-0 right-0 min-w-[18px] h-[18px] bg-[#c8a165] text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden badge-pop">0</span>
      </button>
    </div>
  </header>

  <!-- STICKY SEARCH + FILTER -->
  <div class="sticky top-0 z-40 bg-[#f5f0e8]/95 backdrop-blur-md border-b border-[#d7ccc8]">
    <div class="max-w-lg mx-auto px-4 py-2.5">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#a1887f] pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="search-input" type="search" placeholder="Tìm món..."
          class="w-full pl-9 pr-4 py-2 bg-white border border-[#d7ccc8] rounded-full text-sm placeholder-[#a1887f] focus:outline-none focus:border-[#5d4037]" />
      </div>
      <div id="category-links" class="flex overflow-x-auto scrollbar-hide gap-4 mt-2.5 pb-0.5"></div>
    </div>
  </div>

  <!-- MAIN -->
  <main class="max-w-lg mx-auto px-4 pt-4 pb-10">
    <p id="result-count" class="text-xs text-[#a1887f] mb-3"></p>
    <div id="menu-list" class="space-y-3"></div>
  </main>

  <!-- BOTTOM BAR -->
  <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 z-30 bg-[#5d4037] shadow-2xl px-4 py-3 hidden">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3" onclick="toggleCart()">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <div><p class="text-white text-sm font-semibold" id="bottom-count">0 món</p><p class="text-[#c8a165] text-xs" id="bottom-total">0đ</p></div>
      </div>
      <button onclick="goToCheckout()" class="px-5 py-2 bg-[#c8a165] text-[#4e342e] text-sm font-semibold rounded-full btn-scale">Thanh toán</button>
    </div>
  </div>

  <!-- CART OVERLAY -->
  <div id="cart-overlay" class="cart-overlay fixed inset-0 bg-black/40 z-40" onclick="closeCart()"></div>
  <div id="cart-drawer" class="cart-drawer fixed right-0 top-0 h-full w-full sm:w-[400px] z-50 flex flex-col bg-white shadow-2xl">
    <div class="flex items-center justify-between px-5 h-14 border-b border-[#d7ccc8] flex-shrink-0 bg-[#f5f0e8]">
      <div class="flex items-center gap-2"><span class="font-serif italic text-[#5d4037] store-name">Le Petit</span><h2 class="font-display text-lg font-semibold text-[#4e342e]">Đơn hàng</h2></div>
      <button onclick="closeCart()" class="p-2 -mr-2 btn-scale text-[#a1887f]"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>
    <div id="cart-footer" class="border-t border-[#d7ccc8] px-5 py-4 space-y-3 flex-shrink-0 hidden">
      <div class="flex justify-between text-sm text-stone-500"><span>Tạm tính</span><span id="subtotal">0đ</span></div>
      <div class="flex justify-between text-sm text-stone-500"><span>VAT (10%)</span><span id="vat-amount">0đ</span></div>
      <div class="flex justify-between text-base font-semibold pt-2 border-t border-[#d7ccc8]"><span>Total</span><span id="total" class="text-lg text-[#5d4037]">0đ</span></div>
      <button onclick="goToCheckout()" class="w-full py-3 bg-[#5d4037] hover:bg-[#4e342e] text-white font-semibold rounded-xl btn-scale">Thanh toán — <span id="drawer-total">0đ</span></button>
    </div>
  </div>

  <script src="../../data/store.js"></script>
  <script src="../../data/menu.js"></script>
  <script>ORDERD.featuredTag = 'featured';</script>
  <script>
    const categories = Object.keys(ORDERD.catLabels);
    let activeCat = 'all', cart = [];
    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }

    const searchInput = document.getElementById('search-input');
    let sq = '', st;
    searchInput.addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => { sq = searchInput.value.trim().toLowerCase(); activeCat = 'all'; renderCats(); render(); }, 200); });

    function renderCats() {
      const el = document.getElementById('category-links');
      el.innerHTML = [
        `<button class="cat-link flex-shrink-0 pb-1 text-sm whitespace-nowrap ${activeCat==='all'?'active':'text-[#a1887f]'}" data-cat="all">Tất Cả</button>`,
        ...categories.map(c => `<button class="cat-link flex-shrink-0 pb-1 text-sm whitespace-nowrap ${activeCat===c?'active':'text-[#a1887f]'}" data-cat="${c}">${ORDERD.catLabels[c]}</button>`)
      ].join('');
      el.querySelectorAll('.cat-link').forEach(btn => btn.addEventListener('click', () => { activeCat = btn.dataset.cat; searchInput.value = ''; sq = ''; renderCats(); render(); }));
    }

    function render() {
      let items = ORDERD.items;
      if (sq) items = items.filter(m => m.name.toLowerCase().includes(sq) || m.tags.some(t => t.toLowerCase().includes(sq)));
      if (activeCat !== 'all') items = items.filter(m => m.cat === activeCat);
      document.getElementById('result-count').textContent = items.length + ' món';

      const list = document.getElementById('menu-list');
      if (items.length === 0) {
        list.innerHTML = '<div class="py-16 text-center text-[#a1887f]"><p class="text-lg mb-1">Không tìm thấy món nào</p><p class="text-sm">Thử tìm kiếm khác nhé</p></div>';
      } else {
        list.innerHTML = items.map((m, i) => `
          <div class="menu-item bg-white rounded-2xl overflow-hidden border border-[#d7ccc8] flex" style="animation-delay:${i*60}ms">
            <div class="w-28 h-28 flex-shrink-0 bg-[#efebe9] overflow-hidden">
              <img src="${m.img}" alt="${m.name}" loading="lazy" class="w-full h-full object-cover" />
            </div>
            <div class="flex-1 p-3 flex flex-col justify-between min-w-0">
              <div>
                <div class="flex items-center justify-between gap-2">
                  <h3 class="font-semibold text-sm leading-tight">${m.name}</h3>
                  ${m.tags.includes(ORDERD.featuredTag) ? '<span class="text-[10px] text-[#c8a165] font-medium flex-shrink-0 font-serif italic">★ nổi bật</span>' : ''}
                </div>
                <p class="text-[#a1887f] text-xs leading-relaxed mt-0.5 line-clamp-1">${m.desc}</p>
              </div>
              <div class="flex items-center justify-between gap-2 mt-2">
                <span class="font-semibold text-sm text-[#5d4037]">${formatVND(m.price)}</span>
                <button onclick="event.stopPropagation();update('${m.id}',1)" class="w-7 h-7 flex items-center justify-center bg-[#5d4037] text-white rounded-full btn-scale hover:bg-[#4e342e]">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
      updateCartUI();
    }

    function update(id, delta) { const idx = cart.findIndex(c => c.id === id); if (idx>=0) { cart[idx].qty+=delta; if(cart[idx].qty<=0) cart.splice(idx,1); } else if(delta>0) cart.push({id,qty:delta}); saveLS(); updateCartUI(); }
    function removeFromCart(id) { cart = cart.filter(c => c.id!==id); saveLS(); updateCartUI(); }

    function updateCartUI() {
      const count = cart.reduce((s,c)=>s+c.qty,0), total = cart.reduce((s,c)=>{const m=ORDERD.items.find(x=>x.id===c.id);return s+(m?m.price*c.qty:0)},0);
      const b = document.getElementById('top-badge'); if(count>0){b.textContent=count;b.classList.remove('hidden');} else b.classList.add('hidden');
      const bar = document.getElementById('bottom-bar'); if(count>0){bar.classList.remove('hidden');document.getElementById('bottom-count').textContent=count+' món';document.getElementById('bottom-total').textContent=formatVND(total);} else bar.classList.add('hidden');
      const itemsEl = document.getElementById('cart-items'), footerEl = document.getElementById('cart-footer');
      if(cart.length===0){itemsEl.innerHTML='<div class="flex flex-col items-center justify-center py-20 text-stone-300 gap-3"><svg class="w-14 h-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><p class="text-sm">Chưa có món nào</p></div>';footerEl.classList.add('hidden');return;}
      itemsEl.innerHTML = cart.map(c=>{const m=ORDERD.items.find(x=>x.id===c.id);if(!m)return '';return`<div class="flex gap-3 items-center"><img src="${m.img}" class="w-12 h-12 rounded-xl object-cover" /><div class="flex-1 min-w-0"><h4 class="font-medium text-sm truncate">${m.name}</h4><p class="text-[#c8a165] text-xs">${formatVND(m.price)}</p></div><div class="flex items-center gap-1 bg-[#efebe9] rounded-full p-0.5"><button onclick="update('${m.id}',-1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-[#5d4037] btn-scale text-xs font-bold">−</button><span class="w-6 text-center text-sm font-semibold">${c.qty}</span><button onclick="update('${m.id}',1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-[#5d4037] text-white btn-scale text-xs font-bold">+</button></div><button onclick="removeFromCart('${m.id}')" class="p-1 text-stone-300 hover:text-red-400 btn-scale"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div>`}).join('');
      const sub = cart.reduce((s,c)=>{const m=ORDERD.items.find(x=>x.id===c.id);return s+(m?m.price*c.qty:0)},0), tax=Math.round(sub*0.10*100)/100, totalAll=Math.round((sub+tax)*100)/100;
      document.getElementById('subtotal').textContent = formatVND(sub);
      document.getElementById('vat-amount').textContent = formatVND(tax);
      document.getElementById('total').textContent = formatVND(totalAll);
      document.getElementById('drawer-total').textContent = formatVND(totalAll);
      footerEl.classList.remove('hidden');
    }

    function goToCheckout() { const d=cart.map(c=>{const m=ORDERD.items.find(x=>x.id===c.id);return{...c,name:m.name,price:m.price,img:m.img}}); localStorage.setItem('orderd_cart',JSON.stringify(d)); window.location.href='checkout.html'; }
    function toggleCart(){document.getElementById('cart-drawer').classList.toggle('open');document.getElementById('cart-overlay').classList.toggle('open');document.body.style.overflow=document.getElementById('cart-drawer').classList.contains('open')?'hidden':'';}
    function closeCart(){document.getElementById('cart-drawer').classList.remove('open');document.getElementById('cart-overlay').classList.remove('open');document.body.style.overflow='';}
    function saveLS(){const d=cart.map(c=>{const m=ORDERD.items.find(x=>x.id===c.id);return{...c,name:m?.name,price:m?.price,img:m?.img}});localStorage.setItem('orderd_cart',JSON.stringify(d));}
    function loadLS(){try{cart=JSON.parse(localStorage.getItem('orderd_cart')||'[]').map(c=>({id:c.id,qty:c.qty}));}catch(e){cart=[];}}
    loadLS();
    document.querySelectorAll('.store-name').forEach(el => el.textContent = ORDERD.store.name);
    document.querySelectorAll('.store-tagline').forEach(el => el.textContent = ORDERD.store.tagline);
    renderCats();render();
  </script>
</body>
</html>
