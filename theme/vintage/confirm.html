<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Le Petit — Đặt Hàng Thành Công</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'], serif: ['"Cormorant Garamond"', 'Georgia', 'serif'] } } } }</script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .fade-up { animation: fadeUp 0.5s ease-out forwards; opacity: 0; }
  </style>
</head>
<body class="bg-[#f5f0e8] text-[#4e342e] font-body antialiased min-h-screen flex flex-col items-center justify-center px-6">

  <div class="text-center max-w-sm">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 pop-in">
      <svg class="w-10 h-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>

    <h1 class="font-display text-3xl font-bold text-[#5d4037] mb-2 fade-up" style="animation-delay:0.15s">Đặt hàng thành công!</h1>
    <p class="text-[#a1887f] mb-6 fade-up" style="animation-delay:0.25s">Cảm ơn bạn đã đặt hàng tại <span class="font-semibold text-[#5d4037] store-name">Le Petit</span>. Món sẽ được chuẩn bị ngay!</p>

    <div class="bg-white rounded-2xl p-5 border border-[#d7ccc8] shadow-sm text-left mb-6 fade-up" style="animation-delay:0.35s">
      <h3 class="font-semibold text-sm text-[#a1887f] mb-3">Thông tin đơn hàng</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between"><span class="text-[#a1887f]">Mã đơn</span><span class="font-medium" id="order-id">#ORD-...</span></div>
        <div class="flex justify-between"><span class="text-[#a1887f]">Số món</span><span class="font-medium" id="order-items-count">0</span></div>
        <div class="flex justify-between pt-2 border-t border-[#d7ccc8]"><span class="text-[#a1887f]">Tổng tiền</span><span class="font-bold text-lg text-[#5d4037]" id="order-total">0đ</span></div>
      </div>
    </div>

    <a href="menu.html" class="block w-full py-3.5 bg-[#5d4037] text-white font-semibold rounded-2xl hover:bg-[#4e342e] transition-colors fade-up" style="animation-delay:0.45s">Tiếp tục đặt món</a>
    <a href="store.html" class="block text-center text-sm text-[#a1887f] mt-3 fade-up" style="animation-delay:0.5s">← Về trang cửa hàng</a>
  </div>

  <script src="../../data/store.js"></script>
  <script>
    const data = JSON.parse(localStorage.getItem('orderd_confirm') || '{}');
    document.getElementById('order-items-count').textContent = (data.items || 0) + ' món';
    document.getElementById('order-total').textContent = formatVND(data.total || 0);
    document.getElementById('order-id').textContent = '#ORD-' + Date.now().toString(36).toUpperCase();
    document.querySelectorAll('.store-name').forEach(el => el.textContent = ORDERD.store.name);
    localStorage.removeItem('orderd_confirm');
    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }
  </script>
</body>
</html>
