<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>锦绣楼 — Thực Đơn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } },
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .btn-scale:active { transform: scale(0.95); transition: transform 0.1s; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .menu-item { animation: fadeUp 0.5s ease-out both; cursor: pointer; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .cart-drawer { transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .cart-drawer.open { transform: translateX(0); }
    .cart-overlay { opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .cart-overlay.open { opacity: 1; visibility: visible; }

    .cat-pill { transition: all 0.25s; }
    .cat-pill.active { background: #c62828; color: #fff; transform: scale(1.05); }

    @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .badge-pop { animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }

    /* Chinese ornamental divider */
    .cn-divider { display: flex; align-items: center; gap: 12px; }
    .cn-divider::before, .cn-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, #e0d0c0, transparent); }
  </style>
</head>
<body class="bg-[#fef9f4] text-[#2d1810] font-body antialiased">

  <!-- TOP BANNER -->
  <header class="bg-gradient-to-b from-red-900 via-red-800 to-red-700 px-4 pt-12 pb-8 text-center">
    <div class="text-4xl mb-2">🏮</div>
    <h1 class="font-display text-3xl text-white tracking-widest store-name">锦绣楼</h1>
    <p class="text-red-200 text-sm mt-1 italic store-tagline">Cẩm Tú Lâu — Tinh Hoa Ẩm Thực Hoa</p>
    <div class="flex items-center justify-center gap-3 mt-4">
      <a href="store.html" class="text-red-200 text-xs hover:text-white transition-colors flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Cửa hàng
      </a>
      <span class="text-red-400">·</span>
      <button onclick="toggleCart()" class="text-red-200 text-xs hover:text-white transition-colors flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        Giỏ <span id="top-badge" class="hidden ml-0.5 bg-white text-red-700 text-[10px] font-bold rounded-full px-1.5 py-0.5">0</span>
      </button>
    </div>
  </header>

  <!-- SEARCH BAR -->
  <div class="sticky top-0 z-40 bg-[#fef9f4]/95 backdrop-blur-md border-b border-red-100 px-4 py-3">
    <div class="max-w-lg mx-auto relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-red-300 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="search-input" type="search" placeholder="Tìm món..."
        class="w-full pl-9 pr-4 py-2.5 bg-white border border-red-200 rounded-full text-sm placeholder-red-300 focus:outline-none focus:border-red-400 focus:ring-2 focus:ring-red-100 transition-shadow" />
    </div>
  </div>

  <!-- CATEGORY PILLS -->
  <nav class="sticky top-[56px] z-39 bg-[#fef9f4]/95 backdrop-blur-md border-b border-red-50">
    <div class="max-w-lg mx-auto px-4">
      <div id="category-pills" class="flex gap-1.5 overflow-x-auto py-2 scrollbar-hide px-4">
        <!-- filled by JS -->
      </div>
    </div>
  </nav>

  <!-- MAIN MENU -->
  <main class="max-w-lg mx-auto px-4 py-4 pb-28">
    <p id="result-count" class="text-xs text-red-300 mb-3"></p>
    <div id="menu-list" class="space-y-3"></div>
  </main>

  <!-- FIXED BOTTOM CART -->
  <div id="bottom-cart-bar" class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-red-100 px-4 py-3 hidden">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3" onclick="toggleCart()">
        <div class="relative">
          <svg class="w-6 h-6 text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span id="bottom-badge" class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] bg-red-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
        </div>
        <div>
          <p class="text-sm font-semibold" id="bottom-item-count">0 món</p>
          <p class="text-xs text-red-500" id="bottom-total">0đ</p>
        </div>
      </div>
      <button onclick="goToCheckout()" class="px-5 py-2 bg-red-700 text-white text-sm font-semibold rounded-full btn-scale">Thanh toán</button>
    </div>
  </div>

  <!-- CART OVERLAY -->
  <div id="cart-overlay" class="cart-overlay fixed inset-0 bg-black/40 z-40" onclick="closeCart()"></div>

  <!-- CART DRAWER -->
  <div id="cart-drawer" class="cart-drawer fixed right-0 top-0 h-full w-full sm:w-[400px] z-50 flex flex-col bg-white shadow-2xl">
    <div class="flex items-center justify-between px-5 h-14 border-b border-red-100 flex-shrink-0 bg-gradient-to-r from-red-50 to-white">
      <div class="flex items-center gap-2">
        <span class="text-xl">🏮</span>
        <h2 class="font-display text-lg font-semibold text-red-900">Đơn hàng</h2>
      </div>
      <button onclick="closeCart()" class="p-2 -mr-2 btn-scale text-red-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>

    <div id="cart-footer" class="border-t border-red-100 px-5 py-4 space-y-3 flex-shrink-0 hidden">
      <div class="flex justify-between text-sm text-stone-500"><span>Tạm tính</span><span id="subtotal">0đ</span></div>
      <div class="flex justify-between text-sm text-stone-500"><span>VAT (10%)</span><span id="vat-amount">0đ</span></div>
      <div class="flex justify-between text-base font-semibold pt-2 border-t border-red-100">
        <span>Tổng cộng</span><span id="total" class="text-lg text-red-700">0đ</span>
      </div>
      <button onclick="goToCheckout()" class="w-full py-3 bg-red-700 hover:bg-red-800 text-white font-semibold rounded-xl btn-scale transition-colors">Đặt hàng — <span id="drawer-total-btn">0đ</span></button>
    </div>
  </div>

  <script src="../../data/store.js"></script>
  <script src="../../data/menu.js"></script>
  <script>ORDERD.featuredTag = 'featured';</script>
  <script>
    const categories = Object.keys(ORDERD.catLabels);
    let activeCat = 'all';
    let cart = [];

    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }

    const searchInput = document.getElementById('search-input');
    let searchQuery = '', searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { searchQuery = searchInput.value.trim().toLowerCase(); activeCat = 'all'; renderPills(); render(); }, 200);
    });

    function renderPills() {
      const el = document.getElementById('category-pills');
      el.innerHTML = [
        `<button class="cat-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium ${activeCat==='all'?'active':'bg-white text-red-700 border border-red-200'}" data-cat="all">Tất Cả</button>`,
        ...categories.map(c => `<button class="cat-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium ${activeCat===c?'active':'bg-white text-red-700 border border-red-200'}" data-cat="${c}">${ORDERD.catLabels[c]}</button>`)
      ].join('');
      el.querySelectorAll('.cat-pill').forEach(btn => btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat; searchInput.value = ''; searchQuery = ''; renderPills(); render();
      }));
    }

    function render() {
      let items = ORDERD.items;
      if (searchQuery) items = items.filter(m => m.name.toLowerCase().includes(searchQuery) || m.tags.some(t => t.toLowerCase().includes(searchQuery)));
      if (activeCat !== 'all') items = items.filter(m => m.cat === activeCat);
      document.getElementById('result-count').textContent = items.length + ' món';

      const list = document.getElementById('menu-list');
      if (items.length === 0) {
        list.innerHTML = '<div class="py-16 text-center text-red-300"><p class="text-lg mb-1">Không tìm thấy món nào</p><p class="text-sm">Thử tìm kiếm khác nhé</p></div>';
      } else {
        list.innerHTML = items.map((m, i) => `
          <div class="menu-item bg-white rounded-2xl overflow-hidden shadow-sm border border-red-100 flex active:scale-[0.99] transition-transform" style="animation-delay:${i*60}ms">
            <div class="relative w-28 h-28 flex-shrink-0 bg-red-50 overflow-hidden">
              <img src="${m.img}" alt="${m.name}" loading="lazy" class="w-full h-full object-cover" />
              ${m.tags.includes(ORDERD.featuredTag) ? '<span class="absolute top-2 left-2 px-1.5 py-0.5 bg-red-600 text-white text-[9px] font-bold rounded">招牌</span>' : ''}
              <span class="absolute bottom-2 left-2 px-2 py-0.5 bg-black/60 backdrop-blur-sm text-white text-xs font-bold rounded-full">${formatVND(m.price)}</span>
            </div>
            <div class="flex-1 p-3 flex flex-col justify-between min-w-0">
              <div>
                <h3 class="font-semibold text-sm leading-tight">${m.name}</h3>
                <p class="text-stone-400 text-xs leading-relaxed mt-0.5 line-clamp-2">${m.desc}</p>
              </div>
              <div class="flex items-center justify-between gap-2 mt-2">
                <div class="flex gap-1 flex-wrap">${m.tags.filter(t => t!==ORDERD.featuredTag).map(t => `<span class="px-1.5 py-0.5 bg-red-50 text-red-500 text-[10px] rounded">${t}</span>`).join('')}</div>
                <button onclick="event.stopPropagation();update('${m.id}',1)" class="w-7 h-7 flex items-center justify-center bg-red-700 text-white rounded-full btn-scale hover:bg-red-800 flex-shrink-0">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
      updateCartUI();
    }

    function update(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx >= 0) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); }
      else if (delta > 0) cart.push({ id, qty: delta });
      saveCartToLS();
      updateCartUI();
    }

    function removeFromCart(id) { cart = cart.filter(c => c.id !== id); saveCartToLS(); updateCartUI(); }

    function updateCartUI() {
      const count = cart.reduce((s,c) => s + c.qty, 0);
      const total = cart.reduce((s, c) => { const m = ORDERD.items.find(x => x.id === c.id); return s + (m ? m.price * c.qty : 0); }, 0);

      document.getElementById('top-badge').classList.toggle('hidden', count === 0);
      if (count > 0) document.getElementById('top-badge').textContent = count;

      const bar = document.getElementById('bottom-cart-bar');
      if (count > 0) {
        bar.classList.remove('hidden');
        document.getElementById('bottom-badge').textContent = count;
        document.getElementById('bottom-item-count').textContent = count + ' món';
        document.getElementById('bottom-total').textContent = formatVND(total);
      } else { bar.classList.add('hidden'); }

      const itemsEl = document.getElementById('cart-items');
      const footerEl = document.getElementById('cart-footer');

      if (cart.length === 0) {
        itemsEl.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-stone-300 gap-3"><svg class="w-14 h-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><p class="text-sm">Chưa có món nào</p></div>';
        footerEl.classList.add('hidden');
        return;
      }

      itemsEl.innerHTML = cart.map(c => {
        const m = ORDERD.items.find(x => x.id === c.id); if (!m) return '';
        return `<div class="flex gap-3 items-center"><img src="${m.img}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0" /><div class="flex-1 min-w-0"><h4 class="font-medium text-sm truncate">${m.name}</h4><p class="text-red-500 text-xs">${formatVND(m.price)}</p></div><div class="flex items-center gap-1 bg-red-50 rounded-full p-0.5 flex-shrink-0"><button onclick="update('${m.id}',-1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-red-600 btn-scale text-xs font-bold">−</button><span class="w-6 text-center text-sm font-semibold">${c.qty}</span><button onclick="update('${m.id}',1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-red-700 text-white btn-scale text-xs font-bold">+</button></div><button onclick="removeFromCart('${m.id}')" class="p-1 text-stone-300 hover:text-red-400 btn-scale flex-shrink-0"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div>`;
      }).join('');

      const subtotal = cart.reduce((s,c)=>{const m=ORDERD.items.find(x=>x.id===c.id);return s+(m?m.price*c.qty:0)},0);
      const tax = Math.round(subtotal*0.10*100)/100;
      const totalAll = Math.round((subtotal+tax)*100)/100;
      document.getElementById('subtotal').textContent = formatVND(subtotal);
      document.getElementById('vat-amount').textContent = formatVND(tax);
      document.getElementById('total').textContent = formatVND(totalAll);
      document.getElementById('drawer-total-btn').textContent = formatVND(totalAll);
      footerEl.classList.remove('hidden');
    }

    function goToCheckout() {
      const orderData = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); return { ...c, name: m.name, price: m.price, img: m.img }; });
      localStorage.setItem('orderd_cart', JSON.stringify(orderData));
      window.location.href = 'checkout.html';
    }

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
      document.getElementById('cart-overlay').classList.toggle('open');
      document.body.style.overflow = document.getElementById('cart-drawer').classList.contains('open') ? 'hidden' : '';
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function saveCartToLS() {
      const data = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); return { ...c, name: m?.name, price: m?.price, img: m?.img }; });
      localStorage.setItem('orderd_cart', JSON.stringify(data));
    }

    function loadCartFromLS() {
      try { cart = JSON.parse(localStorage.getItem('orderd_cart') || '[]').map(c => ({ id: c.id, qty: c.qty })); } catch(e) { cart = []; }
    }

    loadCartFromLS();
    document.querySelectorAll('.store-name').forEach(el => el.textContent = ORDERD.store.name);
    document.querySelectorAll('.store-tagline').forEach(el => el.textContent = ORDERD.store.tagline);
    renderPills();
    render();
  </script>
</body>
</html>
