<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>锦绣楼 — Thanh Toán</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .btn-scale:active { transform: scale(0.97); }
    .fade-in { animation: fadeIn 0.4s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[#fef9f4] text-[#2d1810] font-body antialiased">

  <header class="flex items-center px-4 h-14">
    <a href="menu.html" class="p-2 -ml-2 btn-scale">
      <svg class="w-5 h-5 text-red-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <span class="font-display text-lg text-red-900">Thanh toán</span>
    <span class="ml-auto text-2xl">🏮</span>
  </header>

  <div class="max-w-lg mx-auto px-4 flex flex-col" style="min-height: calc(100vh - 56px)">

    <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center">
      <svg class="w-14 h-14 text-red-200 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <p class="text-red-400 text-sm">Chưa có món nào</p>
      <a href="menu.html" class="text-sm font-medium text-red-700 underline mt-2">Quay lại thực đơn</a>
    </div>

    <div id="order-section" class="flex-1 flex flex-col pt-4">

      <div class="bg-white rounded-3xl p-5 shadow-sm border border-red-100 flex-1 flex flex-col">

        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display text-lg text-red-900">Đơn của bạn</h3>
          <a href="menu.html" class="text-sm text-red-500">+ Thêm</a>
        </div>

        <div id="order-items" class="flex-1 overflow-y-auto space-y-3"></div>

        <div class="border-t border-red-100 mt-4 pt-4 space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-stone-500">Tạm tính</span><span id="subtotal">0đ</span></div>
          <div class="flex justify-between"><span class="text-stone-500">VAT (10%)</span><span id="vat-amount">0đ</span></div>
          <div class="flex justify-between font-bold pt-2 border-t border-red-100 text-lg"><span>Tổng</span><span id="total" class="text-xl text-red-700">0đ</span></div>
        </div>

        <div class="mt-4 flex gap-2">
          <button id="pay-cod" onclick="selectPayment('cod')" class="flex-1 py-2.5 bg-red-50 border border-red-300 text-red-900 text-sm font-medium rounded-xl btn-scale flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>Tiền mặt
          </button>
          <button id="pay-transfer" onclick="selectPayment('transfer')" class="flex-1 py-2.5 bg-stone-50 border border-transparent text-stone-400 text-sm font-medium rounded-xl btn-scale flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>Chuyển khoản
          </button>
        </div>

        <button onclick="placeOrder(event)" class="w-full py-3.5 bg-red-700 text-white font-semibold rounded-2xl btn-scale mt-4 flex items-center justify-center gap-2">
          <span>Đặt hàng</span>
          <span class="w-px h-4 bg-white/20"></span>
          <span id="btn-total">0đ</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }
    function loadCart() { try { return JSON.parse(localStorage.getItem('orderd_cart') || '[]'); } catch(e) { return []; } }
    const cart = loadCart();
    if (cart.length === 0) { document.getElementById('empty-state').classList.remove('hidden'); document.getElementById('order-section').classList.add('hidden'); }
    else renderOrder();

    function renderOrder() {
      const el = document.getElementById('order-items'); let sub = 0;
      el.innerHTML = cart.map(item => { const line = item.price * item.qty; sub += line; return `
        <div class="flex items-center gap-3 fade-in">
          <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0 bg-red-50" />
          <div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">${item.name}</p><p class="text-red-400 text-xs">${formatVND(item.price)}</p></div>
          <span class="w-7 h-7 flex items-center justify-center bg-red-50 text-red-700 text-xs font-bold rounded-full">${item.qty}</span>
          <span class="text-sm font-medium flex-shrink-0 w-16 text-right">${formatVND(line)}</span>
        </div>` }).join('');
      const tax = Math.round(sub * 0.10 * 100) / 100, total = Math.round((sub + tax) * 100) / 100;
      document.getElementById('subtotal').textContent = formatVND(sub);
      document.getElementById('vat-amount').textContent = formatVND(tax);
      document.getElementById('total').textContent = formatVND(total);
      document.getElementById('btn-total').textContent = formatVND(total);
    }

    let paymentMethod = 'cod';
    function selectPayment(m) {
      paymentMethod = m;
      document.getElementById('pay-cod').className = m==='cod'
        ? 'flex-1 py-2.5 bg-red-50 border border-red-300 text-red-900 text-sm font-medium rounded-xl btn-scale flex items-center justify-center gap-1.5'
        : 'flex-1 py-2.5 bg-stone-50 border border-transparent text-stone-400 text-sm font-medium rounded-xl btn-scale flex items-center justify-center gap-1.5';
      document.getElementById('pay-transfer').className = m==='transfer'
        ? 'flex-1 py-2.5 bg-red-50 border border-red-300 text-red-900 text-sm font-medium rounded-xl btn-scale flex items-center justify-center gap-1.5'
        : 'flex-1 py-2.5 bg-stone-50 border border-transparent text-stone-400 text-sm font-medium rounded-xl btn-scale flex items-center justify-center gap-1.5';
    }

    function placeOrder(e) { e.preventDefault(); localStorage.removeItem('orderd_cart'); alert('Đặt hàng thành công!\n锦绣楼 xin cảm ơn quý khách.'); window.location.href = 'menu.html'; }
  </script>
</body>
</html>
