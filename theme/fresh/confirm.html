<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OrderD — Đặt Hàng Thành Công</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { body: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } }</script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #f7fafb;
      --bg-secondary: #edf2f3;
      --surface: #ffffff;
      --border: #e8ecef;
      --text: #1a1a1a;
      --text-secondary: #6b7280;
      --primary: #4ea4b3;
      --primary-hover: #4392a0;
      --accent: #b8e1e7;
      --accent-light: #e0f1f3;
    }
    [data-theme="coral"] {
      --bg: #ffffff;
      --bg-secondary: #fdf0eb;
      --surface: #ffffff;
      --border: #f2dfd5;
      --text: #2d231f;
      --text-secondary: #7a6458;
      --primary: #e07b5a;
      --primary-hover: #c96a4a;
      --accent: #f2bfa8;
      --accent-light: #fdf0eb;
    }
    [data-theme="lavender"] {
      --bg: #ffffff;
      --bg-secondary: #f0edf9;
      --surface: #ffffff;
      --border: #e2dcf0;
      --text: #26223a;
      --text-secondary: #6a6485;
      --primary: #7c6bb8;
      --primary-hover: #6a5aa3;
      --accent: #c4b8e8;
      --accent-light: #f0edf9;
    }
    [data-theme="mint"] {
      --bg: #ffffff;
      --bg-secondary: #edf5f0;
      --surface: #ffffff;
      --border: #d8e8dc;
      --text: #1e2d24;
      --text-secondary: #5a7060;
      --primary: #4d8c6a;
      --primary-hover: #3d7356;
      --accent: #a0d4b6;
      --accent-light: #edf5f0;
    }

    body { background: var(--bg); color: var(--text); }
    .btn-scale:active { transform: scale(0.97); }

    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .fade-up { animation: fadeUp 0.5s ease-out forwards; opacity: 0; }
  </style>
</head>
<body class="font-body antialiased min-h-screen flex flex-col items-center justify-center px-6">

  <div class="text-center max-w-sm">
    <div class="w-20 h-20 rounded-[28px] flex items-center justify-center mx-auto mb-6 pop-in shadow-lg" style="background:var(--accent-light)">
      <svg class="w-10 h-10" style="color:var(--primary)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>

    <h1 class="text-3xl font-extrabold mb-2 fade-up" style="animation-delay:0.15s">Đặt hàng thành công!</h1>
    <p class="mb-6 fade-up" style="animation-delay:0.25s;color:var(--text-secondary)">Cảm ơn bạn đã đặt hàng tại <span class="font-bold store-name">OrderD</span>. Chúng tôi sẽ chuẩn bị món và giao đến bạn trong thời gian sớm nhất.</p>

    <div class="rounded-3xl p-5 border text-left mb-6 fade-up" style="animation-delay:0.35s;background:var(--surface);border-color:var(--border)">
      <h3 class="font-bold text-sm mb-3" style="color:var(--text-secondary)">Thông tin đơn hàng</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between"><span style="color:var(--text-secondary)">Mã đơn</span><span class="font-semibold" id="order-id">#ORD-...</span></div>
        <div class="flex justify-between"><span style="color:var(--text-secondary)">Số món</span><span class="font-semibold" id="order-items-count">0</span></div>
        <div class="flex justify-between pt-2" style="border-top:1px solid var(--border)"><span style="color:var(--text-secondary)">Tổng tiền</span><span class="font-bold text-lg" style="color:var(--primary)" id="order-total">0đ</span></div>
      </div>
    </div>

    <a href="menu.html" class="block w-full py-4 text-white font-semibold rounded-2xl btn-scale transition-colors fade-up shadow-lg" style="animation-delay:0.45s;background:var(--primary); box-shadow:0 4px 16px rgba(0,0,0,0.12)">
      Tiếp tục đặt món
    </a>
    <a href="store.html" class="block text-center text-sm mt-3 font-medium fade-up" style="animation-delay:0.5s;color:var(--text-secondary)">← Về trang cửa hàng</a>
  </div>

  <script>
    (function initTheme() {
      const saved = localStorage.getItem('orderd_fresh_theme') || 'aqua';
      document.documentElement.setAttribute('data-theme', saved);
    })();

    async function fetchStoreName() {
      try {
        const res = await fetch('../../data/store.json');
        const data = await res.json();
        return data.store.name;
      } catch(e) {
        return 'OrderD';
      }
    }

    async function init() {
      const storeName = await fetchStoreName();
      document.querySelectorAll('.store-name').forEach(el => el.textContent = storeName);

      const data = JSON.parse(localStorage.getItem('orderd_confirm') || '{}');
      document.getElementById('order-items-count').textContent = (data.items || 0) + ' món';
      document.getElementById('order-total').textContent = formatVND(data.total || 0);
      document.getElementById('order-id').textContent = '#ORD-' + Date.now().toString(36).toUpperCase();
      localStorage.removeItem('orderd_confirm');
    }

    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }

    init();
  </script>
</body>
</html>
