<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OrderD — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }

    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    .cat-chip.active { background: #1c1917; color: #fff; }
    .cat-chip:not(.active):active { background: #e8e5e0; }

    .menu-card { animation: cardIn 0.4s ease-out both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .cart-drawer { transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .cart-drawer.open { transform: translateX(0); }
    .cart-overlay { opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .cart-overlay.open { opacity: 1; visibility: visible; }

    .btn-scale:active { transform: scale(0.95); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
    .badge-pop { animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }

    #main-header { transition: transform 0.3s ease; }
    #main-header.hide { transform: translateY(-100%); }
    #category-nav-bar { transition: transform 0.3s ease, top 0.3s ease; }
    #category-nav-bar.hide { transform: translateY(-100%); }

    #search-input::-webkit-search-cancel-button { display: none; }
  </style>
</head>
<body class="bg-[#fafaf9] text-[#1c1917] font-body antialiased">

  <!-- HEADER -->
  <header id="main-header" class="sticky top-0 z-50 glass border-b border-stone-200/50">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 flex-shrink-0">
        <a href="store.html" class="p-2 -ml-2 btn-scale" title="Thông tin cửa hàng">
          <svg class="w-5 h-5 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        </a>
        <h1 class="font-display text-xl font-bold tracking-tight store-name">OrderD</h1>
      </div>

      <!-- Search -->
      <div class="flex-1 relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search-input" type="search" placeholder="Tìm món..."
          class="w-full pl-9 pr-3 py-1.5 bg-stone-100 border-0 rounded-full text-sm placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-stone-300 transition-shadow" />
      </div>

      <!-- Cart button -->
      <button id="cart-btn" class="relative p-2 -mr-2 btn-scale flex-shrink-0">
        <svg class="w-5 h-5 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span id="cart-badge" class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden badge-pop">0</span>
      </button>
    </div>
  </header>

  <!-- CATEGORY CHIPS -->
  <nav id="category-nav-bar" class="sticky top-0 z-40 bg-[#fafaf9]/90 backdrop-blur-md border-b border-stone-100">
    <div class="max-w-lg mx-auto px-4">
      <div id="category-chips" class="flex gap-2 overflow-x-auto py-2.5 scrollbar-hide -mx-4 px-4">
        <!-- filled by JS -->
      </div>
    </div>
  </nav>

  <!-- RESULTS COUNT -->
  <div class="max-w-lg mx-auto px-4 pt-3 pb-1">
    <p id="result-count" class="text-xs text-stone-400"></p>
  </div>

  <!-- MENU GRID -->
  <main class="max-w-lg mx-auto px-4 pb-10">
    <div id="menu-grid" class="grid grid-cols-2 gap-3"></div>
  </main>

  <!-- FLOATING CART BUTTON (mobile) -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 sm:hidden">
    <button id="floating-cart" class="flex items-center gap-2 px-6 py-3 bg-[#1c1917] text-white font-semibold rounded-full shadow-2xl shadow-stone-900/20 btn-scale hidden whitespace-nowrap">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
      </svg>
      <span id="floating-cart-text" class="whitespace-nowrap">0 món</span>
      <span class="w-px h-4 bg-white/30"></span>
      <span id="floating-cart-total">0đ</span>
    </button>
  </div>

  <!-- CART OVERLAY -->
  <div id="cart-overlay" class="cart-overlay fixed inset-0 bg-stone-900/40 z-40" onclick="closeCart()"></div>

  <!-- CART DRAWER -->
  <div id="cart-drawer" class="cart-drawer fixed right-0 top-0 h-full w-full sm:w-[400px] z-50 flex flex-col bg-white shadow-2xl">
    <!-- Cart header -->
    <div class="flex items-center justify-between px-5 h-14 border-b border-stone-100 flex-shrink-0">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <h2 class="font-display text-lg font-semibold">Đơn hàng</h2>
        <span id="cart-count" class="text-xs text-stone-400 hidden"></span>
      </div>
      <button onclick="closeCart()" class="p-2 -mr-2 btn-scale text-stone-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Cart items -->
    <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>

    <!-- Cart footer -->
    <div id="cart-footer" class="border-t border-stone-100 px-5 py-4 space-y-3 flex-shrink-0 hidden">
      <div class="flex justify-between text-base font-semibold pt-2 border-t border-stone-100"></div>
      <div class="flex justify-between text-base font-semibold pt-2 border-t border-stone-100">
        <span>Tổng cộng</span><span id="total" class="text-lg">0đ</span>
      </div>
      <button onclick="goToCheckout()" class="w-full py-3 bg-[#1c1917] hover:bg-stone-800 text-white font-semibold rounded-xl btn-scale transition-colors">
        Đặt hàng
      </button>
    </div>
  </div>

  <script src="../../data/store.js"></script>
  <script src="../../data/menu.js"></script>
  <script>
     ORDERD.featuredTag = 'featured';
    const categories = Object.keys(ORDERD.catLabels);
    let activeCat = 'all';
    let cart = [];

    function formatVND(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }

    // Search
    const searchInput = document.getElementById('search-input');
    let searchQuery = '';
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = searchInput.value.trim().toLowerCase();
        activeCat = 'all';
        renderChips();
        render();
      }, 200);
    });

    // ====== CATEGORY CHIPS ======
    function renderChips() {
      const el = document.getElementById('category-chips');
      const hasSearch = !!searchQuery;
      el.innerHTML = [
        `<button class="cat-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200 ${activeCat === 'all' ? 'active' : 'bg-stone-100 text-stone-600'}" data-cat="all">Tất Cả</button>`,
        ...categories.map(c =>
          `<button class="cat-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200 ${activeCat === c ? 'active' : 'bg-stone-100 text-stone-600'}" data-cat="${c}">${ORDERD.catLabels[c]}</button>`
        ),
      ].join('');
      el.querySelectorAll('.cat-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCat = btn.dataset.cat;
          searchInput.value = '';
          searchQuery = '';
          renderChips();
          render();
        });
      });
    }

    // ====== RENDER MENU ======
    function render() {
      let items = ORDERD.items;

      // Filter by search
      if (searchQuery) {
        items = items.filter(m => m.name.toLowerCase().includes(searchQuery) || m.tags.some(t => t.toLowerCase().includes(searchQuery)));
      }

      // Filter by category
      if (activeCat !== 'all') {
        items = items.filter(m => m.cat === activeCat);
      }

      // Result count
      document.getElementById('result-count').textContent = items.length + ' món';

      // Render grid
      const grid = document.getElementById('menu-grid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-2 py-16 text-center text-stone-400"><p class="text-lg mb-1">Không tìm thấy món nào</p><p class="text-sm">Thử tìm kiếm khác nhé</p></div>`;
      } else {
        grid.innerHTML = items.map((m, i) => {
          const qty = getQty(m.id);
          return `
            <div class="menu-card bg-white rounded-xl overflow-hidden shadow-sm border border-stone-100 active:scale-[0.98] transition-transform" style="animation-delay:${i*40}ms">
              <div class="relative aspect-[3/2] overflow-hidden bg-stone-100">
                <img src="${m.img}" alt="${m.name}" loading="lazy" class="w-full h-full object-cover" />
                ${m.tags.includes(ORDERD.featuredTag) ? '<span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 bg-amber-500 text-white text-[9px] font-bold rounded-full">BEST</span>' : ''}
              </div>
              <div class="p-2.5">
                <h3 class="font-semibold text-sm leading-tight truncate">${m.name}</h3>
                <div class="flex items-center justify-between gap-2 mt-1.5">
                  <span class="font-bold text-sm">${formatVND(m.price)}</span>
                  <button onclick="event.stopPropagation();update('${m.id}',1)" class="w-7 h-7 flex items-center justify-center bg-[#1c1917] text-white rounded-full btn-scale hover:bg-stone-800 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      updateCartUI();
    }

    // ====== CART ======
    function getQty(id) { const c = cart.find(x => x.id === id); return c ? c.qty : 0; }

    function update(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx >= 0) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
      } else if (delta > 0) {
        cart.push({ id, qty: delta });
      }
      saveCartToLS();
      updateCartUI();
    }

    function removeFromCart(id) { cart = cart.filter(c => c.id !== id); saveCartToLS(); updateCartUI(); }

    function updateCartUI() {
      const count = cart.reduce((s,c) => s + c.qty, 0);
      const badge = document.getElementById('cart-badge');
      const cartCount = document.getElementById('cart-count');
      const floating = document.getElementById('floating-cart');
      const floatingText = document.getElementById('floating-cart-text');
      const floatingTotal = document.getElementById('floating-cart-total');

      if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
      else { badge.classList.add('hidden'); badge.textContent = '0'; }

      if (count > 0) {
        floating.classList.remove('hidden');
        floatingText.textContent = count + ' món';
        const total = cart.reduce((s, c) => { const m = ORDERD.items.find(x => x.id === c.id); return s + (m ? m.price * c.qty : 0); }, 0);
        floatingTotal.textContent = formatVND(total);
      } else {
        floating.classList.add('hidden');
      }

      // Cart panel items
      const itemsEl = document.getElementById('cart-items');
      const footerEl = document.getElementById('cart-footer');
      if (count > 0) { cartCount.classList.remove('hidden'); cartCount.textContent = `(${count})`; }
      else { cartCount.classList.add('hidden'); }

      if (cart.length === 0) {
        itemsEl.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-stone-300 gap-3"><svg class="w-14 h-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><p class="text-sm">Chưa có món nào</p></div>';
        footerEl.classList.add('hidden');
        return;
      }

      itemsEl.innerHTML = cart.map(c => {
        const m = ORDERD.items.find(x => x.id === c.id); if (!m) return '';
        return `
          <div class="flex gap-3 items-center">
            <img src="${m.img}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0" />
            <div class="flex-1 min-w-0">
              <h4 class="font-medium text-sm truncate">${m.name}</h4>
              <p class="text-stone-500 text-xs">${formatVND(m.price)}</p>
            </div>
            <div class="flex items-center gap-1 bg-stone-100 rounded-full p-0.5 flex-shrink-0">
              <button onclick="update('${m.id}',-1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-white text-stone-600 btn-scale text-xs font-bold">−</button>
              <span class="w-6 text-center text-sm font-semibold">${c.qty}</span>
              <button onclick="update('${m.id}',1)" class="w-6 h-6 flex items-center justify-center rounded-full bg-[#1c1917] text-white btn-scale text-xs font-bold">+</button>
            </div>
            <button onclick="removeFromCart('${m.id}')" class="p-1 text-stone-300 hover:text-red-400 btn-scale flex-shrink-0">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>`;
      }).join('');

      const subtotal = cart.reduce((s,c)=>{const m=ORDERD.items.find(x=>x.id===c.id);return s+(m?m.price*c.qty:0)},0);
      const tax = Math.round(subtotal*0.10*100)/100;
      const total = Math.round((subtotal+tax)*100)/100;
      document.getElementById('subtotal').textContent = formatVND(subtotal);
      document.getElementById('tax').textContent = formatVND(tax);
      document.getElementById('total').textContent = formatVND(total);
      footerEl.classList.remove('hidden');
    }

    function goToCheckout() {
      const orderData = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); return { ...c, name: m.name, price: m.price, img: m.img }; });
      localStorage.setItem('orderd_cart', JSON.stringify(orderData));
      window.location.href = 'checkout.html';
    }

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
      document.getElementById('cart-overlay').classList.toggle('open');
      document.body.style.overflow = document.getElementById('cart-drawer').classList.contains('open') ? 'hidden' : '';
    }
    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ====== INIT ======
    function saveCartToLS() {
      const data = cart.map(c => { const m = ORDERD.items.find(x => x.id === c.id); return { ...c, name: m?.name, price: m?.price, img: m?.img }; });
      localStorage.setItem('orderd_cart', JSON.stringify(data));
    }
    function loadCartFromLS() {
      try {
        const data = JSON.parse(localStorage.getItem('orderd_cart') || '[]');
        cart = data.map(c => ({ id: c.id, qty: c.qty }));
      } catch(e) { cart = []; }
    }
    loadCartFromLS();

    // Populate store-branded data
    document.querySelectorAll('.store-name').forEach(el => el.textContent = ORDERD.store.name);

    // Cart button events
    document.getElementById('cart-btn').addEventListener('click', toggleCart);
    document.getElementById('floating-cart').addEventListener('click', toggleCart);

    renderChips();
    render();

    // Scroll category nav horizontally with momentum
    const chipsEl = document.getElementById('category-chips');
    let isDown = false, startX, scrollLeft;
    chipsEl.addEventListener('pointerdown', e => { isDown = true; startX = e.pageX - chipsEl.offsetLeft; scrollLeft = chipsEl.scrollLeft; });
    chipsEl.addEventListener('pointerleave', () => isDown = false);
    chipsEl.addEventListener('pointerup', () => isDown = false);
    chipsEl.addEventListener('pointermove', e => { if(!isDown) return; e.preventDefault(); const x = e.pageX - chipsEl.offsetLeft; chipsEl.scrollLeft = scrollLeft - (x - startX); });

    // Hide header on scroll down, show on scroll up
    let lastScroll = 0;
    const mainHeader = document.getElementById('main-header');
    const navBar = document.getElementById('category-nav-bar');
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      if (y > lastScroll && y > 60) {
        mainHeader.classList.add('hide');
        navBar.style.top = '0px';
      } else if (y < lastScroll) {
        mainHeader.classList.remove('hide');
        navBar.style.top = '56px';
      }
      lastScroll = y;
    }, { passive: true });
  </script>
</body>
</html>
